<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>gfdsss</title>
	<link rel="stylesheet" href="/style.css">
</head>

<body>
	<img id="logo" src="/media/images/fella.webp">

	<div id="popup">
		<div class="popup-box">
			<p><span style="background:white; color:black; padding: 1px 2px;">gfdsss.com</span>
			is work currently in labor to be unveiled when its time is ripe</p>
			
			<button id="popup-ok">So mote it be!</button>
		</div>
	</div>

	<audio id="music" loop preload="auto" muted>
		<source src="/media/audio/La_Primavera_de_Le_Quattro_Stagioni_di_Vivaldi.mp3" type="audio/mpeg">
	</audio>
	<script>
		const music = document.getElementById("music");
		music.volume = 0.2;

		music.load();

		// Sadly, autoplay is blocked browser unless user explicitly interacts :(
		const startMusic = () => {
			music.muted = false;
			music.play().catch(() => {});
		};


		document.getElementById("popup-ok").onclick = () => {
			const popup = document.getElementById("popup");

			popup.style.opacity = "0";
			popup.style.pointerEvents = "none";

			popup.addEventListener("transitionend", () => {
				popup.remove();
			}, {once: true});

			startMusic();
		};

	</script>

	<script src="/script.js"></script>

</body>

</html>
